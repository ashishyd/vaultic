<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vaultic</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 320px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0B1220;
        color: #E7ECF7;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        border-bottom: 1px solid #243044;
      }
      header h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
      }
      .status {
        font-size: 11px;
        color: #8B99B8;
      }
      .status.ok { color: #2DD4BF; }
      .status.warn { color: #F59E0B; }
      .status.err { color: #F87171; }
      main { padding: 10px 12px 14px; }
      .hint {
        font-size: 11px;
        color: #8B99B8;
        margin: 0 0 10px;
      }
      .login {
        display: flex;
        flex-direction: column;
        gap: 2px;
        width: 100%;
        text-align: left;
        border: 1px solid #243044;
        background: #111827;
        color: inherit;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .login:hover { border-color: #2DD4BF; }
      .login strong { font-size: 13px; }
      .login span { font-size: 11px; color: #8B99B8; }
      .empty { font-size: 12px; color: #8B99B8; padding: 8px 2px; }
      footer {
        display: flex;
        gap: 8px;
        padding: 0 12px 12px;
      }
      footer button {
        flex: 1;
        border-radius: 8px;
        border: 1px solid #243044;
        background: #16213A;
        color: #E7ECF7;
        padding: 8px;
        font-size: 12px;
        cursor: pointer;
      }
      footer button:hover { border-color: #2DD4BF; }
    </style>
  </head>
  <body>
    <header>
      <h1>Vaultic</h1>
      <div id="status" class="status">Checking…</div>
    </header>
    <main>
      <p id="page" class="hint"></p>
      <div id="list"></div>
    </main>
    <footer>
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="options">Options</button>
    </footer>
    <script type="module" src="popup.js"></script>
  </body>
</html>
