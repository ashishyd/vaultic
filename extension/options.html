<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vaultic options</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        padding: 16px;
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, sans-serif;
        background: #0B1220;
        color: #E7ECF7;
        min-width: 360px;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      p { color: #8B99B8; font-size: 12px; margin: 0 0 12px; }
      label { display: block; font-size: 11px; color: #8B99B8; margin-bottom: 6px; }
      input {
        width: 100%;
        border-radius: 8px;
        border: 1px solid #243044;
        background: #111827;
        color: #E7ECF7;
        padding: 8px 10px;
        font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .row { display: flex; gap: 8px; margin-top: 10px; }
      button {
        border-radius: 8px;
        border: 1px solid #243044;
        background: #16213A;
        color: #E7ECF7;
        padding: 8px 12px;
        font-size: 12px;
        cursor: pointer;
      }
      button.primary {
        background: #2DD4BF;
        border-color: #2DD4BF;
        color: #0B1220;
        font-weight: 600;
      }
      #msg { margin-top: 10px; font-size: 12px; color: #2DD4BF; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>Connect to Vaultic</h1>
    <p>
      Preferred: in Vaultic → Settings → Browser extension, click <strong>Install browser bridge</strong>
      (registers Chrome Native Messaging). Fallback: paste the bridge token below.
    </p>
    <label for="token">Bridge token</label>
    <input id="token" type="password" placeholder="Paste token from Vaultic Settings" autocomplete="off" />
    <div class="row">
      <button type="button" class="primary" id="save">Save token</button>
      <button type="button" id="test">Test connection</button>
      <button type="button" id="clear">Clear</button>
    </div>
    <div id="msg"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
